spring.application.name=soma

# --- MongoDB ---
# En Spring Boot 4 las propiedades de conexion pasaron de spring.data.mongodb.* a spring.mongodb.*
# (con el nombre antiguo Boot lo ignora y se conecta a la base "test").
spring.mongodb.uri=mongodb://localhost:27017/soma
# auto-index-creation es de Spring Data y conserva su prefijo spring.data.mongodb
spring.data.mongodb.auto-index-creation=true

spring.jackson.default-property-inclusion=non_null

# --- JWT ---
# La clave se toma de la variable de entorno JWT_SECRET (minimo 32 caracteres).
# Si no esta definida, el servidor genera una clave aleatoria temporal al arrancar
# (los tokens dejan de valer cuando se reinicia). Nunca escribas la clave real aqui.
soma.jwt.secret=${JWT_SECRET:}
soma.jwt.expiracion-ms=7200000
